appId: org.snp.typing
productName: SNP Typing
asar: true
compression: maximum
directories:
  output: release
files:
  - electron/main.cjs
  - electron/preload.cjs
  - electron/services/**/*.cjs
  - electron/resources/lessons.json
  - client/.next/standalone/**/*
  - package.json
asarUnpack:
  - client/.next/standalone/**/*
extraMetadata:
  main: electron/main.cjs
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: SNP-Typing-Setup.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SNP Typing
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  uninstallDisplayName: SNP Typing
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
portable:
  artifactName: SNP-Typing-Portable.${ext}



