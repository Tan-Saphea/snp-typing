appId: org.snp.typing
productName: SNP Typing
artifactName: SNP-Typing-Setup.${ext}
asar: true
compression: maximum
directories:
  output: release
files:
  - electron/main.cjs
  - electron/preload.cjs
  - electron/services/**/*.cjs
  - electron/resources/lessons.json
  - client/.next/standalone/**/*
  - package.json
asarUnpack:
  - client/.next/standalone/**/*
extraMetadata:
  main: electron/main.cjs
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SNP Typing
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  uninstallDisplayName: SNP Typing
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico


